name: Create and publish a Docker image for the transaction logger service.

on:
  push:
    tags:
      - 'transaction-logger/*.*.*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: transaction-logger

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: dockerhub-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      # Uses the `docker/login-action` action to log in to the Container registry.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate version and extract image tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export VERSION=$(yq .package.version wallet-proxy-indexer/Cargo.toml)
          TAG_VERSION="${RELEASE_TAG#transaction-logger/}"
          if [ "$RELEASE_TAG" != "transaction-logger/$TAG_VERSION" ] || [ "$VERSION" != "${TAG_VERSION%%-*}" ]; then
             echo "::error Tag $RELEASE_TAG does not match the version ${VERSION}."
             exit 1
          fi
          export FULL_IMAGE_TAG="${{ env.REGISTRY }}/concordium/$IMAGE_NAME:$TAG_VERSION"
          echo "::notice FULL_IMAGE_TAG=${FULL_IMAGE_TAG}"
          # Make sure the image does not exist. Abort if we can retrieve any metadata.
          if docker manifest inspect ${FULL_IMAGE_TAG} > /dev/null; then
             echo "::error ${FULL_IMAGE_TAG} already exists"
             exit 1
          else
             # Store the full image tag into a tag variable for the following step.
             echo "tag=${FULL_IMAGE_TAG}" > "$GITHUB_OUTPUT"
          fi
      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./wallet-proxy-indexer/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tag }}
